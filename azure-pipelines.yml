# Azure DevOps pipeline for the Iowa benefits portal demo.
# Restore -> format check -> build -> test (incl. accessibility smoke
# tests) -> publish artifact. No secrets referenced. A clean automated
# run is not a WCAG compliance claim; manual axe and JAWS testing
# remain separate steps in docs/ACCESSIBILITY.md.
trigger:
  - main

pool:
  vmImage: ubuntu-latest

variables:
  buildConfiguration: Release
  dotnetVersion: 8.0.x

steps:
  - task: UseDotNet@2
    displayName: Install .NET SDK
    inputs:
      version: $(dotnetVersion)

  - task: DotNetCoreCLI@2
    displayName: Restore
    inputs:
      command: restore
      projects: IowaBenefitsPortal.sln

  - task: DotNetCoreCLI@2
    displayName: Format check (code quality)
    inputs:
      command: custom
      custom: format
      arguments: --verify-no-changes --verbosity quiet

  - task: DotNetCoreCLI@2
    displayName: Build
    inputs:
      command: build
      projects: IowaBenefitsPortal.sln
      arguments: --configuration $(buildConfiguration) --no-restore

  - task: DotNetCoreCLI@2
    displayName: Test
    inputs:
      command: test
      projects: tests/IowaBenefitsPortal.Tests/IowaBenefitsPortal.Tests.csproj
      arguments: --configuration $(buildConfiguration) --no-build --logger trx
      publishTestResults: true

  - task: DotNetCoreCLI@2
    displayName: Accessibility smoke tests (structural only)
    inputs:
      command: test
      projects: tests/IowaBenefitsPortal.Tests/IowaBenefitsPortal.Tests.csproj
      arguments: --configuration $(buildConfiguration) --no-build --filter HtmlAccessibilitySmokeTests
      publishTestResults: true

  - task: DotNetCoreCLI@2
    displayName: Publish web app
    inputs:
      command: publish
      projects: src/IowaBenefitsPortal/IowaBenefitsPortal.csproj
      arguments: --configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/app
      publishWebProjects: false
      zipAfterPublish: true

  - task: PublishBuildArtifacts@1
    displayName: Publish artifact
    inputs:
      PathtoPublish: $(Build.ArtifactStagingDirectory)/app
      ArtifactName: iowa-benefits-portal
